<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelayRoute - Peer Parcel Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-start p-2">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200 mt-4">
    <!-- Header -->
    <div class="bg-indigo-600 p-4 text-white text-center">
      <h1 class="text-xl font-bold tracking-wide">RelayRoute</h1>
      <p class="text-xs text-indigo-200">पीयर-टू-पीयर इंटरसिटी पार्सल डिलीवरी</p>
    </div>

    <!-- Toggle Tabs -->
    <div class="flex border-b text-center text-sm font-semibold">
      <button id="tab-send" onclick="switchTab('send')" class="w-1/2 py-3 border-b-2 border-indigo-600 text-indigo-600">पार्सल भेजें</button>
      <button id="tab-verify" onclick="switchTab('verify')" class="w-1/2 py-3 text-gray-500">OTP वेरिफिकेशन</button>
    </div>

    <!-- Tab 1: Send Parcel Form -->
    <div id="content-send" class="p-4 space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-600">सामान की श्रेणी</label>
        <select id="category" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
          <option value="दस्तावेज़ (Documents)">दस्तावेज़ (Documents)</option>
          <option value="इलेक्ट्रॉनिक्स">इलेक्ट्रॉनिक्स / एक्सेसरीज</option>
          <option value="कपड़े / पार्सल">कपड़े / अन्य सामान</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-gray-600">वजन (किग्रा)</label>
          <input type="number" id="weight" value="2.5" step="0.5" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">अनुमानित किराया (₹)</label>
          <input type="number" id="fee" value="250" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600">पिकअप पता</label>
        <input type="text" id="pickup" placeholder="उदा. सेक्टर 62, नोएडा" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600">ड्रॉप पता</label>
        <input type="text" id="drop" placeholder="उदा. एमजी रोड, आगरा" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-gray-600">प्राप्तकर्ता का नाम</label>
          <input type="text" id="receiver_name" placeholder="नाम" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">प्राप्तकर्ता मोबाइल</label>
          <input type="text" id="receiver_phone" placeholder="9876543210" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
        </div>
      </div>

      <button onclick="createParcel()" class="w-full mt-2 bg-indigo-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow hover:bg-indigo-700 transition">
        पार्सल रिक्वेस्ट बुक करें
      </button>

      <!-- Success Box -->
      <div id="booking-result" class="hidden mt-3 p-3 bg-green-50 border border-green-200 rounded-lg text-xs space-y-1"></div>
    </div>

    <!-- Tab 2: OTP Verification -->
    <div id="content-verify" class="hidden p-4 space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-600">पार्सल ID (UUID)</label>
        <input type="text" id="verify-parcel-id" placeholder="पार्सल ID यहाँ पेस्ट करें" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600">पिकअप OTP (4 अंक)</label>
        <input type="text" id="verify-otp" placeholder="1234" maxlength="4" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50 text-center tracking-widest text-lg font-bold">
      </div>

      <button onclick="verifyPickup()" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow hover:bg-emerald-700 transition">
        पिकअप वेरिफाई करें
      </button>

      <div id="verify-result" class="hidden mt-3 p-3 rounded-lg text-xs"></div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      if (tab === 'send') {
        document.getElementById('content-send').classList.remove('hidden');
        document.getElementById('content-verify').classList.add('hidden');
        document.getElementById('tab-send').className = 'w-1/2 py-3 border-b-2 border-indigo-600 text-indigo-600';
        document.getElementById('tab-verify').className = 'w-1/2 py-3 text-gray-500';
      } else {
        document.getElementById('content-send').classList.add('hidden');
        document.getElementById('content-verify').classList.remove('hidden');
        document.getElementById('tab-verify').className = 'w-1/2 py-3 border-b-2 border-indigo-600 text-indigo-600';
        document.getElementById('tab-send').className = 'w-1/2 py-3 text-gray-500';
      }
    }

    async function createParcel() {
      const resBox = document.getElementById('booking-result');
      resBox.classList.remove('hidden');
      resBox.innerHTML = '<span class="text-gray-500">बुकिंग प्रोसेस हो रही है...</span>';

      try {
        const userRes = await fetch('/api/user/default');
        const userData = await userRes.json();

        const payload = {
          sender_id: userData.id,
          category: document.getElementById('category').value,
          weight_kg: document.getElementById('weight').value,
          pickup_address: document.getElementById('pickup').value || 'सेक्टर 62, नोएडा',
          drop_address: document.getElementById('drop').value || 'एमजी रोड, आगरा',
          receiver_name: document.getElementById('receiver_name').value || 'सुरेश कुमार',
          receiver_phone: document.getElementById('receiver_phone').value || '9123456780',
          delivery_fee: parseFloat(document.getElementById('fee').value) || 250
        };

        const response = await fetch('/api/parcels/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.success) {
          const p = data.parcel;
          resBox.className = 'mt-3 p-3 bg-green-50 border border-green-200 rounded-lg text-xs space-y-1 text-green-800';
          resBox.innerHTML = `
            <p class="font-bold text-green-900">✓ पार्सल सफलतापूर्वक बुक हुआ!</p>
            <p><strong>Parcel ID:</strong> <span class="select-all font-mono">${p.id}</span></p>
            <p><strong>पिकअप OTP:</strong> <span class="bg-green-200 px-2 py-0.5 rounded font-bold">${p.pickup_otp}</span></p>
            <p><strong>डिलीवरी OTP:</strong> <span class="bg-green-200 px-2 py-0.5 rounded font-bold">${p.delivery_otp}</span></p>
            <p class="text-[10px] text-gray-600 mt-1">* इस पार्सल ID और OTP से दूसरे टैब में वेरिफिकेशन टेस्ट करें।</p>
          `;
          document.getElementById('verify-parcel-id').value = p.id;
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        resBox.className = 'mt-3 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700';
        resBox.innerText = 'त्रुटि: ' + err.message;
      }
    }

    async function verifyPickup() {
      const resBox = document.getElementById('verify-result');
      const parcel_id = document.getElementById('verify-parcel-id').value.trim();
      const otp = document.getElementById('verify-otp').value.trim();

      if (!parcel_id || !otp) {
        alert('Parcel ID और OTP दोनों भरें');
        return;
      }

      resBox.classList.remove('hidden');
      resBox.className = 'mt-3 p-3 bg-gray-50 border text-gray-600 rounded-lg text-xs';
      resBox.innerText = 'वेरिफाई हो रहा है...';

      try {
        const response = await fetch('/api/parcels/verify-pickup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ parcel_id, otp })
        });
        const data = await response.json();

        if (data.success) {
          resBox.className = 'mt-3 p-3 bg-green-50 border border-green-200 rounded-lg text-xs text-green-800 font-semibold';
          resBox.innerText = '✓ ' + data.message;
        } else {
          resBox.className = 'mt-3 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-800';
          resBox.innerText = '✗ ' + data.error;
        }
      } catch (err) {
        resBox.className = 'mt-3 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-800';
        resBox.innerText = 'कनेक्शन एरर: ' + err.message;
      }
    }
  </script>
</body>
</html>
