<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelayRoute Code Icon</title>
    <style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; margin: 0; }</style>
</head>
<body>
    <!-- यहाँ से हमारा असली ग्राफ़िक कोड शुरू होता है -->
    <svg width="300" height="300" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <!-- बैकग्राउंड (RelayRoute ब्रांड कलर) -->
      <rect width="1024" height="1024" rx="220" fill="#4F46E5"/>
      
      <!-- पीछे रखे हुए टूल्स (पेंच/Wrench) -->
      <g transform="rotate(45 512 512)">
        <rect x="472" y="150" width="80" height="724" rx="20" fill="#CBD5E1"/>
        <path d="M412 180 a 100 100 0 0 1 200 0 h -200 z" fill="#94A3B8"/>
        <circle cx="512" cy="150" r="30" fill="#4F46E5"/>
      </g>
      <g transform="rotate(-45 512 512)">
        <rect x="472" y="150" width="80" height="724" rx="20" fill="#CBD5E1"/>
        <path d="M412 180 a 100 100 0 0 1 200 0 h -200 z" fill="#94A3B8"/>
        <circle cx="512" cy="150" r="30" fill="#4F46E5"/>
      </g>

      <!-- वर्कर का चेहरा -->
      <circle cx="512" cy="562" r="160" fill="#FFCDB2"/>
      
      <!-- आँखें और स्माइल -->
      <circle cx="452" cy="520" r="18" fill="#475569"/>
      <circle cx="572" cy="520" r="18" fill="#475569"/>
      <path d="M452 590 q 60 50 120 0" stroke="#475569" stroke-width="16" fill="none" stroke-linecap="round"/>
      
      <!-- पीला सेफ्टी हेलमेट -->
      <path d="M312 472 a 200 200 0 0 1 400 0 z" fill="#FBBF24"/>
      <!-- हेलमेट का छज्जा (Brim) -->
      <rect x="272" y="452" width="480" height="35" rx="17" fill="#F59E0B"/>
      <!-- हेलमेट के ऊपर का हिस्सा -->
      <rect x="472" y="262" width="80" height="30" rx="15" fill="#F59E0B"/>
    </svg>
</body>
</html>
